<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SOR Terminal – Xbox KOS Scanner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>SOR Terminal</h1>
      <p>Xbox KOS / DDOS Friend List Scanner</p>
    </header>

    <section id="auth-section">
      <button id="login-btn">Sign in with Microsoft</button>
      <p class="hint">
        Login is handled securely by Microsoft / Xbox. Your password never touches SOR Terminal.
      </p>
    </section>

    <section id="scan-section" class="hidden">
      <div class="input-row">
        <label for="gt-input">Target Gamertag:</label>
        <input id="gt-input" type="text" placeholder="Enter gamertag to scan" />
        <button id="scan-btn">Scan Friends</button>
      </div>

      <div id="quick-links">
        <button id="open-xbox-profile">Open Xbox Profile</button>
        <button id="open-xbox-friends">Open Xbox Friends List</button>
        <button id="open-leafapp">Open LeafApp</button>
        <button id="open-haloquery">Open HaloQuery</button>
      </div>

      <div id="results">
        <h2>Scan Results</h2>
        <div id="status"></div>
        <div class="results-columns">
          <div>
            <h3>Friends</h3>
            <ul id="friends-list"></ul>
          </div>
          <div>
            <h3>General KOS Hits</h3>
            <ul id="kos-list"></ul>
          </div>
          <div>
            <h3>DDOS Hits</h3>
            <ul id="ddos-list"></ul>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
